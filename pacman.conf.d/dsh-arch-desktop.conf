# Add to /etc/pacman.conf on client machines.
#
# The database is served by GitHub Pages from the x86_64/ directory. Package
# bodies are not served from Pages; each database entry records the
# GitHub Releases asset URL for its package, and pacman fetches the body from
# there. This split exists because GitHub rejects any file above 100 MB in a
# normal repository, while a release asset may be far larger.
#
# SigLevel is Optional TrustAll because this repository is unsigned. That is a
# deliberate tradeoff for a repository holding only self-built packages used on
# machines already under the same control. Revisit if it ever serves machines
# the owner does not administer.
[dsh-arch-desktop]
Server = https://boyunxi.github.io/dsh-arch-desktop/x86_64
SigLevel = Optional TrustAll
