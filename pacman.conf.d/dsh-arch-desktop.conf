# 把以下内容加到客户端的 /etc/pacman.conf 末尾。
#
# 数据库与软件包本体都由本仓库的 Release 提供。两者必须同源：pacman 先取
# <仓库名>.db，再按数据库里记录的 %FILENAME% 到同一个 Server 路径下取包体。
# 之所以不用 GitHub Pages：Pages 放不下 350 MB 的包体，客户端必然 404。
#
# SigLevel 设为 Optional TrustAll 是因为本仓库未签名。本仓库只存放自建包、
# 使用环境都在同一控制之下，这是有意的取舍。若将来要服务自己不管理的机器，
# 应改用签名仓库。
#
# Server 末尾的 arch 是 Release 的 tag 名，不是包架构（架构为 x86_64）。
# 该 tag 一旦变更，所有客户端的 Server 都要同步修改。
[dsh-arch-desktop]
Server = https://github.com/boyunxi/dsh-arch-desktop/releases/download/arch
SigLevel = Optional TrustAll
