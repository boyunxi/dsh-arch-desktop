# Add to /etc/pacman.conf on client machines.
#
# The database is served by GitHub Pages from the x86_64/ directory; package
# bodies come from the GitHub Releases assets referenced inside that database.
# Replace USERNAME with the GitHub account owning this repository.
#
# SigLevel is Optional TrustAll because this repository is unsigned. Locally
# that is a deliberate tradeoff: signing would require importing and trusting a
# key on every client for a repository that only ever holds self-built packages.
[dsh-arch-desktop]
Server = https://USERNAME.github.io/dsh-arch-desktop/x86_64
SigLevel = Optional TrustAll
